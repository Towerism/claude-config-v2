[project]
name = "claude-config"
version = "2.0.0"
description = "Guardrails and two-machine deploy for Claude Code on top of oh-my-claudecode"
requires-python = ">=3.11"

# Dev-only. The deployed hooks and tools/cfg.py use the standard library alone.
[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.17.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
# Agent worktrees live under .claude; they are not this checkout's files.
extend-exclude = [".claude"]
